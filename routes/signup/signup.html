<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="media/img/mini/Matikanetannhauser.webp" type="image/x-icon">
    <title>Samweb</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="script/libphonenumber-js.min.js" defer></script>
    <script src="script/signup.js" defer></script>
</head>
<body class="login">
    <header>
        <nav>
            <div class="top-menu">
                <div class="top-menu__perfil">
                    <img class="top-menu__perfil-img" src="media//img/mini/Mayano_Top_Gun.webp" alt="">
                    <p class="top-menu__perfil-name"> | Yer</p>
                </div>
                <div class="top-menu__links">
                    <a href="/" class="top-menu__link">Inicio</a>
                    <a href="#" class="top-menu__link">Noticias</a>
                    <a href="#" class="top-menu__link">Comandos</a>
                    <a href="home" class="top-menu__link">Más</a>
                </div>
                <div class="top-menu__login">
                    <a href="#" class="top-menu__login-lang">ESP</a>
                    <a href="login" class="top-menu__login-button">Iniciar Sesión</a>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section class="section-1">
            <div class="action-card login">
                <img class="action-card__logo" src="media/img/mini/Mayano_Top_Gun.webp" alt="">
                <h2 class="action-card__title">Sam</h2>
                <p class="action-card__p">Registro</p>
                <form class="action-card__form" id="loginForm" action="" method="POST">
                    <label class="action-card__label"> 
                        <select id="prefix" class="action-card__select">
                            <option value="" class="action-card__option">CO +57</option>
                        </select>
                        <input id="inputMailPhone" class="action-card__input action-card__input--prefix" placeholder="Celular" type="tel" name="contactUid" required>
                    </label>
                    <label class="action-card__label"> 
                        <input id="inputMailPhone" class="action-card__input" placeholder="Nombre" type="tel" name="name" required>
                    </label>
                    <label class="action-card__label"> 
                        <input id="inputMailPhone" class="action-card__input" placeholder="Nombre" type="tel" name="description" required>
                    </label>
                    <label id="loginPasswordLabel" class="action-card__label">
                        <input id="loginPasswordInput" class="action-card__input" placeholder="Contraseña" type="password" name="password">
                    </label>
                        <input type="hidden" value="login">
                    
                    <input id="submitFormButton" class="action-card__button" type="submit" value="Enviar">
                    <p id="codigoEnviado"></p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
