<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Summary of the page">
    <link rel="shortcut icon" href="media/img/mini/Matikanetannhauser.webp" type="image/x-icon">
    <title>Samweb</title>
    <link rel="stylesheet" href="css/style.css">

    <script src="script/libphonenumber-js.min.js" defer></script>
    <script src="script/signup.js" defer></script>
    <script src="script/header.js"></script>
</head>
<body class="login">

    <header>
        <nav>
            <top-menu></top-menu>
        </nav>
    </header>

    <main>
        <section class="section-1">
            <div class="action-card signup">
                <svg id="signupformBack" class="action-card__arrow-back rounded-3 hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="40px" height="40px" fill="currentColor">
                    <path d="M160,89.75H56l53-53a9.67,9.67,0,0,0,0-14,9.67,9.67,0,0,0-14,0l-56,56a30.18,30.18,0,0,0-8.5,18.5c0,1-.5,1.5-.5,2.5a6.34,6.34,0,0,0,.5,3,31.47,31.47,0,0,0,8.5,18.5l56,56a9.9,9.9,0,0,0,14-14l-52.5-53.5H160a10,10,0,0,0,0-20Z"/>
                </svg>
                <img class="action-card__logo" src="media/img/mini/Mayano_Top_Gun.webp" alt="">
                <h2 class="action-card__title">Sam</h2>
                <p class="action-card__p">Registro</p>
                
                <form class="action-card__form" id="sendCodeForm">
                    <label class="action-card__label"> 
                        <select id="prefix" class="action-card__select">
                            <option value="" class="action-card__option">CO +57</option>
                        </select>
                        <input id="inputMailPhone" class="action-card__input action-card__input--prefix" placeholder="Celular" type="tel" name="contactUid" required>
                    </label>
                    <input class="action-card__button" type="submit" value="Enviar codigo">
                </form>

                <form class="action-card__form d-none" id="verificationForm">
                    
                    <label class="action-card__label"> 
                        <input id="inputCode" class="action-card__input" placeholder="Codigo" type="tel" name="code" required>
                    </label>
                    <input class="action-card__button" type="submit" value="Verificar">
                </form>
                
                <form class="action-card__form d-none" id="signupForm">
                    <label class="action-card__label"> 
                        <input id="inputName" class="action-card__input" placeholder="Nombre" type="tel" name="name" required>
                    </label>
                    <label id="loginPasswordLabel" class="action-card__label">
                        <input id="inputPassword" class="action-card__input" placeholder="Contraseña" type="password" name="password">
                    </label>
                    <input class="action-card__button" type="submit" value="Verificar">
                </form>
                <p class="action-card__p py-2" id="phoneCodeSent"></p>
            </div>
        </section>
    </main>
</body>
</html>
